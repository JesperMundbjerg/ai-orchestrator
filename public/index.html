<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="color-scheme" content="dark" />
<title>AI Orchestrator</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0b0d'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%23ffb454' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23ffb454' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23ffb454'/%3E%3C/svg%3E" />
<style>
  /* ============ Design tokens ============ */
  :root {
    --bg:        #0b0b0d;
    --bg-2:      #101013;
    --panel:     #141419;
    --panel-2:   #17171d;
    --line:      #26241f;
    --amber:     #ffb454;
    --amber-hi:  #ffc978;
    --amber-dim: #b4823f;
    --amber-soft:rgba(255,180,84,.12);
    --amber-glow:rgba(255,180,84,.40);
    --green:     #74b463;
    --green-dim: #4e7a44;
    --red:       #ff5a4d;
    --red-glow:  rgba(255,90,77,.35);
    --ink:       #ece0cb;
    --ink-mute:  #9a917f;
    --ink-faint: #6b6455;
    --font-disp: "Bahnschrift", "Segoe UI Semibold", "Segoe UI", sans-serif;
    --font-mono: "Cascadia Mono", "Cascadia Code", Consolas, "Courier New", monospace;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background:
      radial-gradient(120% 90% at 20% 0%, #131217 0%, var(--bg) 55%, #060608 100%);
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 15px;
    line-height: 1.5;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ============ Atmosphere: scanlines + vignette ============ */
  body::before {
    content: "";
    position: fixed; inset: 0; z-index: 40; pointer-events: none;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,.16) 3px, rgba(0,0,0,0) 4px);
    opacity: .5;
    mix-blend-mode: multiply;
  }
  body::after {
    content: "";
    position: fixed; inset: 0; z-index: 41; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 42%, rgba(0,0,0,.5) 100%);
  }

  /* ============ App shell ============ */
  .app {
    position: relative; z-index: 1;
    display: grid;
    grid-template-columns: 300px 1fr;
    height: 100vh;
    height: 100dvh;
  }

  /* ---- Left rail ---- */
  .rail {
    display: flex;
    flex-direction: column;
    padding: 24px 22px;
    border-right: 1px solid var(--line);
    background:
      linear-gradient(180deg, rgba(255,180,84,.03), rgba(0,0,0,0) 30%),
      var(--bg-2);
    min-height: 0;
  }

  .brand { flex: 0 0 auto; }
  .wordmark {
    font-family: var(--font-disp);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .34em;
    line-height: 1.06;
    font-size: 25px;
    color: var(--amber);
    text-shadow: 0 0 18px var(--amber-glow);
    margin: 0;
  }
  .wordmark span { display: block; }
  .wordmark .w2 { color: var(--ink); text-shadow: none; letter-spacing: .28em; }
  .meta {
    margin-top: 12px;
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
    color: var(--ink-mute);
    min-height: 14px;
  }
  .notice {
    margin-top: 10px;
    font-size: 11.5px;
    color: var(--red);
    letter-spacing: .04em;
    display: none;
  }

  /* ---- Dock (coil + controls) ---- */
  .dock {
    flex: 1 1 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    min-height: 0;
  }

  /* Push-to-talk coil */
  .coil {
    position: relative;
    width: 172px; height: 172px;
    border-radius: 50%;
    border: 2px solid var(--amber-dim);
    background:
      radial-gradient(circle at 50% 38%, #201d18 0%, #131114 70%, #0d0c0e 100%);
    color: var(--amber);
    cursor: pointer;
    display: grid;
    place-items: center;
    touch-action: none;
    transition: border-color .18s ease, box-shadow .18s ease, filter .2s ease, transform .08s ease;
    outline: none;
    -webkit-tap-highlight-color: transparent;
  }
  .coil:focus-visible { box-shadow: 0 0 0 3px rgba(255,180,84,.4); }
  .coil .ring {
    position: absolute; inset: 16px;
    border-radius: 50%;
    border: 1px solid rgba(255,180,84,.30);
    pointer-events: none;
  }
  .coil .ring::before {
    content: "";
    position: absolute; inset: 12px;
    border-radius: 50%;
    border: 1px solid rgba(255,180,84,.16);
  }
  .coil .mic { width: 48px; height: 48px; display: block; }
  .coil:active { transform: scale(.98); }

  .coil.active {
    border-color: var(--amber);
    color: var(--amber-hi);
    box-shadow: 0 0 34px var(--amber-glow), inset 0 0 26px rgba(255,180,84,.16);
    background:
      radial-gradient(circle at 50% 38%, #322612 0%, #1a150e 72%, #100d0b 100%);
  }
  .coil.active::after {
    content: "";
    position: absolute; inset: -3px;
    border-radius: 50%;
    border: 2px solid var(--amber);
    animation: coil-pulse 1.3s ease-out infinite;
    pointer-events: none;
  }
  @keyframes coil-pulse {
    0%   { transform: scale(1);    opacity: .7; }
    100% { transform: scale(1.4);  opacity: 0;  }
  }
  .coil.disabled {
    filter: grayscale(.85) brightness(.55);
    opacity: .55;
    cursor: not-allowed;
    box-shadow: none;
  }

  .interim {
    min-height: 34px;
    width: 100%;
    text-align: center;
    font-size: 12.5px;
    color: var(--ink-mute);
    letter-spacing: .02em;
    line-height: 1.35;
    padding: 0 4px;
  }
  .interim.live { color: var(--amber); text-shadow: 0 0 12px var(--amber-glow); }

  /* Toggle buttons */
  .toggles { display: flex; gap: 10px; width: 100%; justify-content: center; }
  .tgl {
    flex: 1 1 0;
    min-width: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    padding: 9px 10px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--ink-mute);
    font-family: var(--font-disp);
    font-size: 11.5px;
    letter-spacing: .16em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color .15s, color .15s, background .15s, box-shadow .15s;
  }
  .tgl:hover:not(:disabled) { border-color: var(--amber-dim); color: var(--ink); }
  .tgl:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(255,180,84,.4); }
  .tgl .dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; opacity: .5; }
  .tgl.on {
    color: var(--amber);
    border-color: var(--amber-dim);
    background: var(--amber-soft);
    box-shadow: 0 0 14px rgba(255,180,84,.14);
  }
  .tgl.on .dot { opacity: 1; box-shadow: 0 0 8px var(--amber-glow); }
  .tgl#muteBtn.on { color: var(--red); border-color: rgba(255,90,77,.4); background: rgba(255,90,77,.08); box-shadow: none; }
  .tgl#muteBtn.on .dot { box-shadow: 0 0 8px var(--red-glow); }
  .tgl:disabled { opacity: .4; cursor: not-allowed; }

  /* Status chip */
  .chip-wrap { display: inline-flex; align-items: center; gap: 8px; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 9px;
    padding: 7px 16px;
    border-radius: 22px;
    border: 1px solid var(--line);
    background: var(--panel);
    font-family: var(--font-disp);
    font-size: 12px;
    letter-spacing: .2em;
    text-transform: uppercase;
    color: var(--ink-mute);
    cursor: pointer;
    transition: color .15s, border-color .15s, box-shadow .15s, background .15s;
  }
  .chip:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(255,180,84,.4); }
  .chip .led { width: 9px; height: 9px; border-radius: 50%; background: currentColor; }
  .chip-ready    { color: var(--green);  border-color: var(--green-dim); }
  .chip-ready .led { box-shadow: 0 0 8px rgba(116,180,99,.6); }
  .chip-thinking { color: var(--amber);  border-color: var(--amber-dim); box-shadow: 0 0 14px rgba(255,180,84,.12); }
  .chip-listening{ color: var(--amber-hi); border-color: var(--amber); background: var(--amber-soft); box-shadow: 0 0 18px rgba(255,180,84,.25); }
  .chip-speaking { color: var(--amber);  border-color: var(--amber-dim); background: var(--amber-soft); }
  .chip-offline  { color: var(--red);    border-color: rgba(255,90,77,.45); box-shadow: 0 0 14px rgba(255,90,77,.15); }

  .cursor {
    display: none;
    width: 9px; height: 17px;
    background: var(--amber);
    box-shadow: 0 0 10px var(--amber-glow);
  }
  .status-thinking .cursor { display: inline-block; animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---- Main comms column ---- */
  .main {
    display: flex;
    flex-direction: column;
    min-width: 0;
    min-height: 0;
    background:
      linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,0) 8%),
      var(--bg);
  }
  .main-head {
    flex: 0 0 auto;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 22px 12px;
    border-bottom: 1px solid var(--line);
  }
  .main-head h2 {
    margin: 0;
    font-family: var(--font-disp);
    font-size: 13px;
    letter-spacing: .28em;
    text-transform: uppercase;
    color: var(--ink-mute);
    font-weight: 600;
  }
  .main-head .hint { font-size: 11px; color: var(--ink-faint); letter-spacing: .08em; }

  .log {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 14px 22px 6px;
    scrollbar-color: var(--amber-dim) transparent;
    scrollbar-width: thin;
  }
  .log::-webkit-scrollbar { width: 9px; }
  .log::-webkit-scrollbar-thumb { background: #2c2a24; border-radius: 6px; }
  .log::-webkit-scrollbar-thumb:hover { background: var(--amber-dim); }

  .entry {
    display: grid;
    grid-template-columns: 66px 46px 1fr;
    gap: 10px;
    padding: 4px 0;
    align-items: baseline;
    animation: line-in .15s ease-out;
  }
  @keyframes line-in {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: none; }
  }
  .entry .ts { color: var(--ink-faint); font-size: 12px; font-variant-numeric: tabular-nums; }
  .entry .tag {
    font-family: var(--font-disp);
    font-size: 11px;
    letter-spacing: .14em;
    text-align: right;
    padding-top: 1px;
  }
  .entry .body { color: var(--ink); white-space: pre-wrap; word-break: break-word; overflow-wrap: anywhere; }

  .t-you  { color: var(--green); }
  .t-orc  { color: var(--amber); text-shadow: 0 0 10px var(--amber-glow); }
  .t-tool { color: #8fb3c9; }
  .t-sys  { color: var(--ink-faint); }

  .entry .body.assistant { color: var(--amber-hi); }
  .entry .body.tool { color: #a9c4d6; font-size: 14px; }
  .entry.subtle .body { color: var(--ink-mute); font-size: 13px; }
  .entry.subtle .ts { color: var(--ink-faint); }
  .entry.error .body {
    color: var(--red);
    background: rgba(255,90,77,.09);
    border-left: 2px solid var(--red);
    padding: 3px 8px;
    border-radius: 0 3px 3px 0;
  }
  .entry.error .tag { color: var(--red); }

  /* ---- Typed input row ---- */
  .composer {
    flex: 0 0 auto;
    display: flex;
    gap: 10px;
    padding: 12px 22px 16px;
    border-top: 1px solid var(--line);
    background: linear-gradient(0deg, rgba(255,180,84,.03), rgba(0,0,0,0));
  }
  .composer .prompt { color: var(--amber); align-self: center; font-size: 16px; }
  .composer input {
    flex: 1 1 auto;
    min-width: 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    color: var(--ink);
    font-family: var(--font-mono);
    font-size: 15px;
    padding: 11px 14px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .composer input::placeholder { color: var(--ink-faint); }
  .composer input:focus { border-color: var(--amber-dim); box-shadow: 0 0 0 2px rgba(255,180,84,.15); }
  .composer .send {
    flex: 0 0 auto;
    padding: 0 18px;
    border-radius: 8px;
    border: 1px solid var(--amber-dim);
    background: var(--amber-soft);
    color: var(--amber);
    font-family: var(--font-disp);
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .15s, box-shadow .15s;
  }
  .composer .send:hover { background: rgba(255,180,84,.2); box-shadow: 0 0 14px rgba(255,180,84,.2); }
  .composer .send:focus-visible { outline: none; box-shadow: 0 0 0 2px rgba(255,180,84,.4); }

  /* ============ Responsive: stack under 760px ============ */
  @media (max-width: 760px) {
    body { overflow: auto; }
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh; height: 100dvh;
    }
    .rail { display: contents; }
    .brand {
      order: 0;
      padding: 16px 18px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--bg-2);
    }
    .wordmark { font-size: 20px; letter-spacing: .28em; }
    .wordmark span { display: inline; }
    .wordmark .w2::before { content: " "; }
    .main {
      order: 1;
      flex: 1 1 auto;
      min-height: 0;
    }
    .dock {
      order: 2;
      flex: 0 0 auto;
      padding: 14px 18px calc(16px + env(safe-area-inset-bottom, 0px));
      gap: 12px;
      border-top: 1px solid var(--line);
      background: var(--bg-2);
    }
    .coil { width: 116px; height: 116px; }
    .coil .mic { width: 34px; height: 34px; }
    .coil .ring { inset: 12px; }
    .interim { min-height: 20px; font-size: 12px; }
    .toggles { max-width: 420px; }
    .chip-wrap { margin-bottom: 2px; }
  }

  /* ============ Reduced motion ============ */
  @media (prefers-reduced-motion: reduce) {
    .entry { animation: none; }
    .coil.active::after { animation: none; opacity: 0; }
    .status-thinking .cursor { animation: none; }
    .coil, .tgl, .chip, .composer input, .composer .send { transition: none; }
  }
</style>
</head>
<body>
  <div class="app">
    <aside class="rail">
      <div class="brand">
        <h1 class="wordmark"><span class="w1">AI</span><span class="w2">Orchestrator</span></h1>
        <div class="meta" id="meta" aria-live="off"></div>
        <div class="notice" id="notice" role="status"></div>
      </div>

      <div class="dock">
        <button id="coil" class="coil" type="button" aria-label="Push to talk — hold to speak" aria-disabled="false">
          <span class="ring" aria-hidden="true"></span>
          <svg class="mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="9" y="2.5" width="6" height="11" rx="3" fill="currentColor" stroke="none"></rect>
            <path d="M5.5 11a6.5 6.5 0 0 0 13 0"></path>
            <line x1="12" y1="17.5" x2="12" y2="21"></line>
            <line x1="8.5" y1="21" x2="15.5" y2="21"></line>
          </svg>
        </button>

        <div class="interim" id="interim" aria-live="polite"></div>

        <div class="toggles">
          <button id="openMicBtn" class="tgl" type="button" aria-pressed="false" aria-label="Open microphone (continuous listening)">
            <span class="dot" aria-hidden="true"></span><span class="lbl">OPEN MIC</span>
          </button>
          <button id="muteBtn" class="tgl" type="button" aria-pressed="false" aria-label="Mute assistant voice">
            <span class="dot" aria-hidden="true"></span><span class="lbl">SOUND</span>
          </button>
        </div>

        <div class="chip-wrap" id="chipWrap">
          <button id="chip" class="chip chip-offline" type="button" aria-live="polite" aria-label="Connection status; click to stop speaking">
            <span class="led" aria-hidden="true"></span><span id="chipLabel">OFFLINE</span>
          </button>
          <span class="cursor" aria-hidden="true"></span>
        </div>
      </div>
    </aside>

    <main class="main">
      <div class="main-head">
        <h2>Comms Log</h2>
        <span class="hint">hold mic or SPACE to talk</span>
      </div>
      <div id="log" class="log" role="log" aria-live="polite" aria-label="Communications log"></div>
      <form class="composer" id="composer" autocomplete="off">
        <span class="prompt" aria-hidden="true">&gt;</span>
        <input id="input" type="text" placeholder="Type a command for the first mate…" aria-label="Type a message to the orchestrator" />
        <button class="send" type="submit">Send</button>
      </form>
    </main>
  </div>

<script>
"use strict";
(function () {
  /* ============ Single state object ============ */
  var state = {
    connected: false,
    serverState: "starting",   // starting | ready | thinking | dead
    sessionId: null,
    model: null,
    recogSupported: false,
    recognizing: false,        // recognition currently active
    speaking: false,           // TTS currently active
    openMic: false,            // open-mic toggle enabled
    micMode: "off",            // off | ptt | open
    ptt: false,                // push-to-talk held
    muted: false,
    interim: "",               // live interim transcript
    autoScroll: true
  };

  var recog = null;            // SpeechRecognition instance
  var pttBuffer = "";          // accumulated finals during push-to-talk
  var currentUtter = null;     // latest TTS utterance
  var MUTE_KEY = "aio_muted";

  /* ============ DOM refs ============ */
  var el = {};
  function cacheDom() {
    ["meta","notice","coil","interim","openMicBtn","muteBtn","chipWrap","chip",
     "chipLabel","log","composer","input"].forEach(function (id) { el[id] = document.getElementById(id); });
  }

  /* ============ Helpers ============ */
  function pad(n) { return String(n).padStart(2, "0"); }
  function fmtTime(ts) {
    var d = ts ? new Date(ts) : new Date();
    return pad(d.getHours()) + ":" + pad(d.getMinutes()) + ":" + pad(d.getSeconds());
  }
  function isAtBottom(node) {
    return node.scrollHeight - node.scrollTop - node.clientHeight < 40;
  }
  function scrollToBottom(node) { node.scrollTop = node.scrollHeight; }
  function isTyping() {
    var a = document.activeElement;
    if (!a) return false;
    var t = a.tagName;
    return t === "INPUT" || t === "TEXTAREA" || a.isContentEditable;
  }
  function micUsable() {
    return state.recogSupported && state.connected && state.serverState !== "dead";
  }

  /* Strip markdown/URLs/code so the ear hears clean prose. */
  function cleanForSpeech(text) {
    var t = String(text == null ? "" : text);
    t = t.replace(/```[\s\S]*?```/g, " code omitted ");   // fenced code
    t = t.replace(/```[\s\S]*$/g, " code omitted ");       // unterminated fence
    t = t.replace(/`([^`]*)`/g, "$1").replace(/`/g, "");   // inline backticks
    t = t.replace(/https?:\/\/\S+/gi, " link ");
    t = t.replace(/\bwww\.\S+/gi, " link ");
    t = t.replace(/!\[[^\]]*\]\([^)]*\)/g, " ");            // image md
    t = t.replace(/\[([^\]]*)\]\([^)]*\)/g, "$1");          // link md -> text
    t = t.replace(/[*_#>~|]/g, " ");                        // emphasis / headings / quotes
    t = t.replace(/\s+/g, " ").trim();
    return t;
  }

  /* ============ Status chip ============ */
  function computeStatus() {
    if (!state.connected || state.serverState === "dead") return { label: "OFFLINE", cls: "offline" };
    if (state.recognizing) return { label: "LISTENING", cls: "listening" };
    if (state.speaking)    return { label: "SPEAKING",  cls: "speaking" };
    if (state.serverState === "thinking") return { label: "THINKING", cls: "thinking" };
    return { label: "READY", cls: "ready" };
  }

  /* ============ Render (reflect state -> DOM) ============ */
  function render() {
    var st = computeStatus();
    el.chip.className = "chip chip-" + st.cls;
    el.chipLabel.textContent = st.label;
    el.chipWrap.classList.toggle("status-thinking", st.cls === "thinking");

    var coilDisabled = !micUsable() || state.openMic;
    el.coil.classList.toggle("disabled", coilDisabled);
    el.coil.classList.toggle("active", state.micMode === "ptt" && (state.ptt || state.recognizing));
    el.coil.setAttribute("aria-disabled", String(coilDisabled));

    el.openMicBtn.classList.toggle("on", state.openMic);
    el.openMicBtn.setAttribute("aria-pressed", String(state.openMic));
    el.openMicBtn.disabled = !state.recogSupported;

    el.muteBtn.classList.toggle("on", state.muted);
    el.muteBtn.setAttribute("aria-pressed", String(state.muted));
    el.muteBtn.querySelector(".lbl").textContent = state.muted ? "MUTED" : "SOUND";

    if (state.model || state.sessionId) {
      var sid = state.sessionId ? String(state.sessionId).slice(0, 8) : "";
      el.meta.textContent = [state.model, sid].filter(Boolean).join("  ·  ");
    } else {
      el.meta.textContent = "";
    }

    if (state.recognizing) {
      el.interim.classList.add("live");
      el.interim.textContent = state.interim
        ? state.interim
        : (state.micMode === "open" ? "open mic — listening" : "listening…");
    } else {
      el.interim.classList.remove("live");
      el.interim.textContent = "";
    }
  }
  function renderInterimOnly() {
    if (!state.recognizing) return;
    el.interim.textContent = state.interim || (state.micMode === "open" ? "open mic — listening" : "listening…");
  }

  /* ============ Comms log ============ */
  function clearLog() {
    el.log.textContent = "";
    state.autoScroll = true;
  }

  function addLog(evt) {
    var entry = document.createElement("div");
    entry.className = "entry";

    var ts = document.createElement("span");
    ts.className = "ts";
    ts.textContent = fmtTime(evt.ts);

    var tag = document.createElement("span");
    tag.className = "tag";

    var body = document.createElement("span");
    body.className = "body";

    switch (evt.kind) {
      case "user":
        tag.textContent = "YOU"; tag.classList.add("t-you");
        body.textContent = evt.text || "";
        break;
      case "assistant":
        tag.textContent = "ORC"; tag.classList.add("t-orc");
        body.textContent = evt.text || "";
        body.classList.add("assistant");
        break;
      case "tool":
        tag.textContent = "TOOL"; tag.classList.add("t-tool");
        body.textContent = (evt.name || "tool") + (evt.detail ? " — " + evt.detail : "");
        body.classList.add("tool");
        break;
      case "result":
        tag.textContent = "SYS"; tag.classList.add("t-sys");
        var secs = (Number(evt.ms) || 0) / 1000;
        var line = "turn " + secs.toFixed(1) + "s";
        if (evt.costUsd != null) line += " · $" + Number(evt.costUsd).toFixed(4);
        body.textContent = line;
        entry.classList.add("subtle");
        break;
      case "state":
        tag.textContent = "SYS"; tag.classList.add("t-sys");
        body.textContent = "state → " + (evt.state || "?") + (evt.model ? " · " + evt.model : "");
        entry.classList.add("subtle");
        break;
      case "error":
        tag.textContent = "SYS"; tag.classList.add("t-sys");
        body.textContent = evt.message || "error";
        entry.classList.add("error");
        break;
      default:
        tag.textContent = "SYS"; tag.classList.add("t-sys");
        try { body.textContent = JSON.stringify(evt); } catch (e) { body.textContent = "(event)"; }
    }

    entry.appendChild(ts);
    entry.appendChild(tag);
    entry.appendChild(body);
    el.log.appendChild(entry);
    if (state.autoScroll) scrollToBottom(el.log);
  }

  /* ============ Server: SSE + POST ============ */
  function connectSSE() {
    var es;
    try { es = new EventSource("/events"); }
    catch (e) { state.connected = false; render(); return; }

    es.addEventListener("open", function () {
      state.connected = true;
      clearLog();       // server replays ~200 events on connect — avoid duplicates
      render();
    });
    es.addEventListener("message", function (e) {
      var evt;
      try { evt = JSON.parse(e.data); } catch (err) { return; }
      handleEvent(evt);
    });
    es.addEventListener("error", function () {
      // EventSource auto-reconnects; just reflect the drop.
      state.connected = false;
      render();
    });
  }

  function handleEvent(evt) {
    if (!evt || !evt.kind) return;
    if (evt.kind === "state") {
      if (evt.state) state.serverState = evt.state;
      if (evt.sessionId) state.sessionId = evt.sessionId;
      if (evt.model) state.model = evt.model;
    }
    addLog(evt);
    if (evt.kind === "assistant" && evt.text) speak(evt.text);
    render();
  }

  function say(text) {
    var t = String(text == null ? "" : text).trim();
    if (!t) return;
    fetch("/say", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ text: t })
    }).then(function (res) {
      if (res.ok) return;
      res.json().then(function (j) {
        addLog({ kind: "error", message: (j && j.error) ? j.error : ("send failed (" + res.status + ")"), ts: Date.now() });
      }).catch(function () {
        addLog({ kind: "error", message: "send failed (" + res.status + ")", ts: Date.now() });
      });
    }).catch(function (err) {
      addLog({ kind: "error", message: "network error: " + (err && err.message ? err.message : "unreachable"), ts: Date.now() });
    });
  }

  function fetchStatus() {
    fetch("/status").then(function (r) {
      if (!r.ok) return null;
      return r.json();
    }).then(function (j) {
      if (!j) return;
      if (j.state) state.serverState = j.state;
      if (j.sessionId) state.sessionId = j.sessionId;
      if (j.model) state.model = j.model;
      render();
    }).catch(function () { /* status is best-effort */ });
  }

  /* ============ Speech recognition (voice input) ============ */
  function detectSpeech() {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    state.recogSupported = !!SR;
    if (!SR) {
      el.notice.style.display = "block";
      el.notice.textContent = "voice needs Chrome or Edge — typing still works";
      return;
    }
    recog = new SR();
    recog.lang = navigator.language || "en-US";
    recog.interimResults = true;
    recog.continuous = true;
    recog.onstart = function () { state.recognizing = true; render(); };
    recog.onresult = onRecogResult;
    recog.onerror = onRecogError;
    recog.onend = onRecogEnd;
  }

  function startRecog() {
    if (!recog) return;
    try { recog.start(); } catch (e) { /* already started */ }
  }
  function stopRecog() {
    if (!recog) return;
    try { recog.stop(); } catch (e) { /* already stopped */ }
  }

  function onRecogResult(e) {
    var interim = "";
    var final = "";
    for (var i = e.resultIndex; i < e.results.length; i++) {
      var res = e.results[i];
      if (res.isFinal) final += res[0].transcript;
      else interim += res[0].transcript;
    }
    if (state.micMode === "open") {
      if (final.trim()) say(final.trim());   // fire each final immediately
      state.interim = interim;
    } else if (state.micMode === "ptt") {
      if (final) pttBuffer += final;
      state.interim = interim;
    }
    renderInterimOnly();
  }

  function onRecogError(e) {
    if (e && e.error === "not-allowed") {
      addLog({ kind: "error", message: "microphone permission denied", ts: Date.now() });
      state.openMic = false;
      state.micMode = "off";
    }
    // other errors (no-speech, aborted, network) fall through to onend
  }

  function onRecogEnd() {
    state.recognizing = false;
    if (state.micMode === "ptt") {
      var text = ((pttBuffer || "") + " " + (state.interim || "")).trim();
      pttBuffer = "";
      state.interim = "";
      state.micMode = "off";
      state.ptt = false;
      if (text) say(text);           // ignore empty transcripts
    } else if (state.openMic && !state.speaking) {
      startRecog();                  // open-mic auto-restart (never while speaking)
    }
    render();
  }

  /* Push-to-talk */
  function startPTT() {
    if (!micUsable() || state.openMic) return;
    if (state.micMode !== "off") return;
    state.micMode = "ptt";
    state.ptt = true;
    pttBuffer = "";
    state.interim = "";
    startRecog();
    render();
  }
  function endPTT() {
    if (state.micMode !== "ptt") { state.ptt = false; render(); return; }
    state.ptt = false;
    stopRecog();      // onend finalizes + posts
    render();
  }

  /* Open-mic toggle */
  function toggleOpenMic() {
    if (state.openMic) {
      state.openMic = false;
      if (state.micMode === "open") {
        state.micMode = "off";
        stopRecog();
      }
    } else {
      if (!micUsable()) return;
      if (state.micMode === "ptt") return;   // don't clobber an active push-to-talk
      state.openMic = true;
      state.micMode = "open";
      if (!state.speaking) startRecog();
    }
    render();
  }

  /* ============ Speech synthesis (voice output) ============ */
  function loadMute() {
    try { state.muted = localStorage.getItem(MUTE_KEY) === "1"; } catch (e) { state.muted = false; }
  }
  function toggleMute() {
    state.muted = !state.muted;
    try { localStorage.setItem(MUTE_KEY, state.muted ? "1" : "0"); } catch (e) {}
    if (state.muted && "speechSynthesis" in window) window.speechSynthesis.cancel();
    render();
  }

  function suspendMicForSpeech() {
    if (state.openMic && state.recognizing) stopRecog();   // never let the mic hear the assistant
  }
  function resumeMicAfterSpeech() {
    if (state.openMic && !state.recognizing) startRecog();
  }

  function speak(text) {
    if (state.muted || !("speechSynthesis" in window)) return;
    var clean = cleanForSpeech(text);
    if (!clean) return;
    window.speechSynthesis.cancel();          // latest assistant line wins
    var u = new SpeechSynthesisUtterance(clean);
    u.lang = (recog && recog.lang) || navigator.language || "en-US";
    u.onstart = function () {
      state.speaking = true;
      suspendMicForSpeech();
      render();
    };
    var finish = function () {
      if (currentUtter !== u) return;         // a newer utterance already took over
      state.speaking = false;
      currentUtter = null;
      resumeMicAfterSpeech();
      render();
    };
    u.onend = finish;
    u.onerror = finish;
    currentUtter = u;
    window.speechSynthesis.speak(u);
  }

  /* ============ Event wiring ============ */
  function wireEvents() {
    // Push-to-talk: coil pointer hold
    el.coil.addEventListener("pointerdown", function (e) {
      e.preventDefault();
      try { el.coil.setPointerCapture(e.pointerId); } catch (er) {}
      startPTT();
    });
    el.coil.addEventListener("pointerup", function () { endPTT(); });
    el.coil.addEventListener("pointercancel", function () { endPTT(); });
    el.coil.addEventListener("contextmenu", function (e) { e.preventDefault(); });

    // Push-to-talk: Space key (only when not typing)
    window.addEventListener("keydown", function (e) {
      if (e.code !== "Space" && e.key !== " ") return;
      if (isTyping()) return;
      if (e.repeat) return;
      e.preventDefault();
      startPTT();
    });
    window.addEventListener("keyup", function (e) {
      if (e.code !== "Space" && e.key !== " ") return;
      if (isTyping()) return;
      e.preventDefault();
      endPTT();
    });

    el.openMicBtn.addEventListener("click", toggleOpenMic);
    el.muteBtn.addEventListener("click", toggleMute);

    // Status chip: click to stop speaking
    el.chip.addEventListener("click", function () {
      if (state.speaking && "speechSynthesis" in window) {
        window.speechSynthesis.cancel();
        state.speaking = false;
        currentUtter = null;
        resumeMicAfterSpeech();
        render();
      }
    });

    // Typed input
    el.composer.addEventListener("submit", function (e) {
      e.preventDefault();
      var v = el.input.value;
      if (v.trim()) { say(v); el.input.value = ""; }
    });

    // Auto-scroll follow / release
    el.log.addEventListener("scroll", function () {
      state.autoScroll = isAtBottom(el.log);
    });

    // Cancel any speech when the tab is hidden (avoids background chatter)
    document.addEventListener("visibilitychange", function () {
      if (document.hidden && "speechSynthesis" in window) window.speechSynthesis.cancel();
    });
  }

  /* ============ Init ============ */
  function init() {
    cacheDom();
    loadMute();
    detectSpeech();
    wireEvents();
    render();
    fetchStatus();
    connectSSE();
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
